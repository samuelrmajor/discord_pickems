# Posts the week's power rankings to Discord once voting locks.
#
# GitHub's scheduler is UTC-only and has no notion of US daylight saving, so
# 5pm Eastern is 21:00 UTC for most of the season and 22:00 UTC from November.
# Rather than guess, both hours fire every Thursday: the endpoint re-checks
# whether the week has actually locked and claims the post atomically, so the
# run on the wrong hour simply reports "already posted" and exits.
name: Post power rankings

on:
  schedule:
    - cron: "5 21 * * 4" # Thu 17:05 ET while US Eastern is on daylight time
    - cron: "5 22 * * 4" # Thu 17:05 ET once Eastern is back on standard time
  workflow_dispatch: # lets you fire it by hand from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the rankings post
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL variable and CRON_SECRET secret must both be set"
            exit 1
          fi

          # --fail-with-body so a non-2xx still shows what the app said.
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/rankings"
          echo
